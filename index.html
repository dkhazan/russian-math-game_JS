<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учимся читать и считать</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #e8f4fc url('background.png') no-repeat center center fixed;
  background-size: cover;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
#app {
  width: 100%;
  max-width: 900px;
  text-align: center;
  position: relative;
}
#gear {
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 32px;
  cursor: pointer;
  z-index: 100;
  background: rgba(255,255,255,0.75);
  border-radius: 50%;
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
button {
  font-size: 28px;
  padding: 18px 36px;
  margin: 12px;
  border: none;
  border-radius: 16px;
  background: #4a90e2;
  color: white;
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}
button:hover { background: #357abd; }
.letter-grid, .number-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin: 20px 0;
}
.letter, .num {
  width: 72px;
  height: 72px;
  font-size: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  border-radius: 14px;
  cursor: pointer;
  box-shadow: 0 3px 6px rgba(0,0,0,0.15);
}
.letter:hover, .num:hover { background: #d0e8ff; }
#start-btn {
  font-size: 40px;
  padding: 28px 56px;
  background: #ff6b6b;
}
#menu, #games, #letters, #numbers, #alphabet, #count { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="gear" onclick="alert('Настройки (скоро)')">⚙️</div>

  <div id="menu">
    <button id="start-btn" onclick="startWelcome()">Учимся читать и писать</button>
  </div>

  <div id="games">
    <button onclick="startGame('letters')">Буквы</button>
    <button onclick="startGame('numbers')">Считай</button>
    <button onclick="startGame('alphabet')">Алфавит</button>
    <button onclick="startGame('count')">Цифры</button>
  </div>

  <div id="letters">
    <h2>Найди букву</h2>
    <button id="repeat-btn" onclick="playCurrentLetter()">Повтори</button>
    <div class="letter-grid" id="letter-choices"></div>
    <button onclick="backToMenu()">← другая игра</button>
  </div>

  <div id="numbers">
    <div id="number-question"></div>
    <div class="number-grid" id="number-choices"></div>
    <button onclick="backToMenu()">← другая игра</button>
  </div>

  <div id="alphabet">
    <div class="letter-grid" id="alphabet-grid"></div>
    <button onclick="backToMenu()">← другая игра</button>
  </div>

  <div id="count">
    <div class="number-grid" id="count-grid"></div>
    <button onclick="backToMenu()">← другая игра</button>
  </div>
</div>

<script>
const letters = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ".split("");
const numbers = Array.from({length:21}, (_,i)=>i);
let currentLetter = "";
let welcomeAudio = null;
let audioUnlocked = false;

function getLetterFile(letter) {
  return letter === "Ё" ? "letter_yo.ogg" : `letter_${letter}.ogg`;
}

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  new Audio().play().catch(()=>{});
}

function playSound(name) {
  if (!audioUnlocked) return;
  const a = new Audio(name);
  a.play().catch(()=>{});
  return a;
}

function startWelcome() {
  unlockAudio();
  document.getElementById("menu").style.display = "none";
  document.getElementById("games").style.display = "block";
  if (welcomeAudio) welcomeAudio.pause();
  welcomeAudio = playSound("welcome.ogg");
}

function stopWelcome() {
  if (welcomeAudio) {
    welcomeAudio.pause();
    welcomeAudio.currentTime = 0;
    welcomeAudio = null;
  }
}

function startGame(game) {
  stopWelcome();
  document.getElementById("games").style.display = "none";
  document.getElementById(game).style.display = "block";
  if (game === "letters") startLetters();
  if (game === "numbers") startNumbers();
  if (game === "alphabet") buildAlphabet();
  if (game === "count") buildCount();
}

function backToMenu() {
  ["letters","numbers","alphabet","count"].forEach(id => document.getElementById(id).style.display = "none");
  document.getElementById("games").style.display = "block";
}

function startLetters() {
  currentLetter = letters[Math.floor(Math.random()*letters.length)];
  document.getElementById("repeat-btn").textContent = "Повтори";
  document.getElementById("repeat-btn").onclick = playCurrentLetter;
  buildLetterChoices();
  setTimeout(playCurrentLetter, 300);
}

function playCurrentLetter() {
  playSound(getLetterFile(currentLetter));
}

function buildLetterChoices() {
  const container = document.getElementById("letter-choices");
  container.innerHTML = "";
  const choices = [currentLetter];
  while (choices.length < 4) {
    const l = letters[Math.floor(Math.random()*letters.length)];
    if (!choices.includes(l)) choices.push(l);
  }
  choices.sort(() => Math.random()-0.5);
  choices.forEach(l => {
    const div = document.createElement("div");
    div.className = "letter";
    div.textContent = l;
    div.onclick = () => {
      if (l === currentLetter) {
        playSound("success.ogg");
        document.getElementById("repeat-btn").textContent = "Продолжить";
        document.getElementById("repeat-btn").onclick = startLetters;
      } else {
        playSound("wrong.ogg");
      }
    };
    container.appendChild(div);
  });
}

function startNumbers() {
  const n = Math.floor(Math.random()*10)+1;
  document.getElementById("number-question").innerHTML = `<h2>Сколько кругов?</h2><div style="font-size:72px;margin:10px">${"●".repeat(n)}</div>`;
  const container = document.getElementById("number-choices");
  container.innerHTML = "";
  let opts = [n];
  while (opts.length < 4) {
    const x = Math.floor(Math.random()*15)+1;
    if (!opts.includes(x)) opts.push(x);
  }
  opts.sort(() => Math.random()-0.5).forEach(num => {
    const div = document.createElement("div");
    div.className = "num";
    div.textContent = num;
    div.onclick = () => {
      if (num === n) {
        playSound("success.ogg");
        setTimeout(startNumbers, 700);
      } else playSound("wrong.ogg");
    };
    container.appendChild(div);
  });
}

function buildAlphabet() {
  const container = document.getElementById("alphabet-grid");
  container.innerHTML = "";
  letters.forEach(l => {
    const div = document.createElement("div");
    div.className = "letter";
    div.textContent = l;
    div.onclick = () => playSound(getLetterFile(l));
    container.appendChild(div);
  });
}

function buildCount() {
  const container = document.getElementById("count-grid");
  container.innerHTML = "";
  numbers.forEach(n => {
    const div = document.createElement("div");
    div.className = "num";
    div.textContent = n;
    div.onclick = () => playSound(`number_${n}.ogg`);
    container.appendChild(div);
  });
}

document.getElementById("menu").style.display = "block";
</script>
</body>
</html>
